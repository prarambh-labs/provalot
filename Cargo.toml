[package]
name = "provalot"
version = "0.1.1"
edition = "2021"
description = "Deterministic evidence gate for coding agents"
license = "MIT"
repository = "https://github.com/prarambh-labs/provalot"

[[bin]]
name = "provalot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
