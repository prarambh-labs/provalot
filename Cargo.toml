[package]
name = "provalot"
version = "0.1.2"
edition = "2021"
description = "Deterministic evidence gate for coding agents"
license = "MIT"
repository = "https://github.com/prarambh-labs/provalot"
homepage = "https://github.com/prarambh-labs/provalot"
documentation = "https://github.com/prarambh-labs/provalot#readme"
readme = "README.md"
keywords = ["claude-code", "codex", "coding-agent", "hooks", "verification"]
categories = ["development-tools", "development-tools::testing", "command-line-utilities"]
exclude = ["/.provalot/", "/.remember/", "/.superpowers/", "/npm/", "/hooks/", "/.claude-plugin/", "/.github/", "/scripts/"]

[[bin]]
name = "provalot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
